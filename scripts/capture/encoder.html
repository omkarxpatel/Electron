<!doctype html>
<html><head><meta charset="utf-8"><title>encoder</title></head>
<body style="margin:0;background:#000">
<script>
/*
 * Frame sequence → WebM, using Chromium's own MediaRecorder.
 *
 * There is no ffmpeg on this machine, and adding an encoder dependency to a
 * screenshot tool is a poor trade. MediaRecorder is already in the runtime
 * and produces a file the website can play directly.
 *
 * The window is created with webSecurity:false so file:// frames can be
 * drawn without tainting the canvas — a tainted canvas cannot be captured,
 * and captureStream() is the whole mechanism here.
 */
async function encode(dir, count, fps, width, height) {
  const canvas = document.createElement('canvas');
  canvas.width = width;
  canvas.height = height;
  // Must be in the document. A detached canvas is never composited, and
  // captureStream() on one yields a track that produces zero frames —
  // MediaRecorder then stops cleanly and returns an empty blob.
  canvas.style.cssText = 'position:fixed;left:0;top:0;width:320px;height:200px';
  document.body.appendChild(canvas);
  const ctx = canvas.getContext('2d', { alpha: false });

  const frames = [];
  for (let i = 0; i < count; i++) {
    const img = new Image();
    img.src = `file://${dir}/f${String(i).padStart(3, '0')}.png`;
    await img.decode();
    frames.push(img);
  }

  const stream = canvas.captureStream(fps);
  const mime = MediaRecorder.isTypeSupported('video/webm;codecs=vp9')
    ? 'video/webm;codecs=vp9'
    : 'video/webm';
  const track = stream.getVideoTracks()[0];
  if (!track) throw new Error('captureStream produced no video track');
  const rec = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 6_000_000 });
  const chunks = [];
  rec.ondataavailable = (e) => e.data.size && chunks.push(e.data);

  const done = new Promise((r) => (rec.onstop = r));
  rec.start();
  // Real time: MediaRecorder samples the stream against the wall clock, so
  // the frames have to be presented at the rate they should play back at.
  for (const f of frames) {
    ctx.drawImage(f, 0, 0, width, height);
    // requestFrame() where available: it pushes a frame to the track
    // explicitly rather than relying on the compositor noticing in time.
    if (track.requestFrame) track.requestFrame();
    await new Promise((r) => setTimeout(r, 1000 / fps));
  }
  await new Promise((r) => setTimeout(r, 250));
  rec.stop();
  await done;

  const blob = new Blob(chunks, { type: 'video/webm' });
  const buf = await blob.arrayBuffer();
  let s = '';
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i += 0x8000) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  }
  return btoa(s);
}
</script>
</body></html>
