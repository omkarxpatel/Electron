<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">
  <!-- Menu-bar template glyph: four EQ bars. Pure black on transparent so
       macOS can tint it for light/dark menu bars and for the highlighted
       (clicked) state. Named *Template.png for that auto-tinting to kick in.
       No width/height on purpose — qlmanage renders the SVG at its intrinsic
       size otherwise, leaving the glyph in a corner of the output canvas. -->
  <g fill="#000000">
    <rect x="1.5"  y="6"   width="2" height="4"  rx="1"/>
    <rect x="5"    y="2.5" width="2" height="11" rx="1"/>
    <rect x="8.5"  y="4.5" width="2" height="7"  rx="1"/>
    <rect x="12"   y="7"   width="2" height="2"  rx="1"/>
  </g>
</svg>
